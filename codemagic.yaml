# FactChecker Pro desktop: signed and notarized Mac build (Intel and Apple Silicon).
# Start it manually in Codemagic. Output: a .dmg (for people to download) and a .zip.
#
# One-time setup in Codemagic (Team settings > Global variables, or app Environment variables):
#   Group "mac_signing", all values marked Secure:
#     CSC_LINK            the Developer ID Application certificate as a base64 .p12
#     CSC_KEY_PASSWORD    the password of that .p12
#   For Apple's notarization check, EITHER the App Store Connect API key:
#     APP_STORE_CONNECT_KEY_IDENTIFIER, APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_PRIVATE_KEY (the .p8 text)
#   OR an Apple ID with an app-specific password:
#     APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
workflows:
  mac-release:
    name: FactChecker Pro Mac release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 20
      groups:
        - mac_signing
    scripts:
      - name: Check signing settings
        script: |
          if [ -z "$CSC_LINK" ] || [ -z "$CSC_KEY_PASSWORD" ]; then
            echo "Missing CSC_LINK or CSC_KEY_PASSWORD in the mac_signing group." && exit 1
          fi
          # Decode the certificate ourselves (spaces or line breaks from pasting are removed),
          # check it opens with the password, and hand electron-builder a real file.
          CERT="$HOME/developer-id.p12"
          printf '%s' "$CSC_LINK" | tr -d ' \n\r\t"' | base64 --decode > "$CERT" 2>/dev/null || true
          SIZE=$(wc -c < "$CERT" | tr -d ' ')
          echo "CSC_LINK has $(printf '%s' "$CSC_LINK" | tr -d ' \n\r\t' | wc -c | tr -d ' ') characters, certificate file is $SIZE bytes (expected about 4300 and 3230)."
          if ! openssl pkcs12 -in "$CERT" -passin env:CSC_KEY_PASSWORD -noout -legacy 2>/dev/null && ! openssl pkcs12 -in "$CERT" -passin env:CSC_KEY_PASSWORD -noout 2>/dev/null; then
            echo "The certificate in CSC_LINK could not be opened. Paste the whole of CSC_LINK.txt again, and check CSC_KEY_PASSWORD." && exit 1
          fi
          echo "CSC_LINK=$CERT" >> $CM_ENV
          if [ -n "$APP_STORE_CONNECT_PRIVATE_KEY" ]; then
            mkdir -p ~/private_keys
            echo "$APP_STORE_CONNECT_PRIVATE_KEY" > ~/private_keys/AuthKey.p8
            echo "APPLE_API_KEY=$HOME/private_keys/AuthKey.p8" >> $CM_ENV
            echo "APPLE_API_KEY_ID=$APP_STORE_CONNECT_KEY_IDENTIFIER" >> $CM_ENV
            echo "APPLE_API_ISSUER=$APP_STORE_CONNECT_ISSUER_ID" >> $CM_ENV
          elif [ -z "$APPLE_ID" ]; then
            echo "Add the App Store Connect API key or an Apple ID for notarization." && exit 1
          fi
      - name: Install packages
        script: npm ci
      - name: Build, sign and notarize
        script: npm run dist:mac
      - name: Check the signature and notarization
        script: |
          APP=$(ls -d release/mac-universal/*.app | head -1)
          codesign --verify --deep --strict --verbose=2 "$APP"
          spctl --assess --type execute --verbose "$APP"
    artifacts:
      - release/*.dmg
      - release/*.zip
