# FactChecker Pro desktop: signed and notarized Mac build (Intel and Apple Silicon).
# Start it manually in Codemagic. Output: a .dmg (for people to download) and a .zip.
#
# One-time setup in Codemagic (Team settings > Global variables, or app Environment variables):
#   Group "mac_signing", all values marked Secure:
#     CSC_LINK            the Developer ID Application certificate as a base64 .p12
#     CSC_KEY_PASSWORD    the password of that .p12
#   For Apple's notarization check, EITHER the App Store Connect API key:
#     APP_STORE_CONNECT_KEY_IDENTIFIER, APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_PRIVATE_KEY (the .p8 text)
#   OR an Apple ID with an app-specific password:
#     APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
workflows:
  mac-release:
    name: FactChecker Pro Mac release
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      node: 20
      groups:
        - mac_signing
    scripts:
      - name: Check signing settings
        script: |
          if [ -z "$CSC_LINK" ] || [ -z "$CSC_KEY_PASSWORD" ]; then
            echo "Missing CSC_LINK or CSC_KEY_PASSWORD in the mac_signing group." && exit 1
          fi
          # Decode the certificate ourselves (spaces or line breaks from pasting are removed),
          # check it opens with the password, and hand electron-builder a real file.
          CERT="$HOME/developer-id.p12"
          printf '%s' "$CSC_LINK" | tr -d ' \n\r\t"' | base64 --decode > "$CERT" 2>/dev/null || true
          SIZE=$(wc -c < "$CERT" | tr -d ' ')
          echo "CSC_LINK has $(printf '%s' "$CSC_LINK" | tr -d ' \n\r\t' | wc -c | tr -d ' ') characters, certificate file is $SIZE bytes (expected about 4300 and 3230)."
          if ! openssl pkcs12 -in "$CERT" -passin env:CSC_KEY_PASSWORD -noout -legacy 2>/dev/null && ! openssl pkcs12 -in "$CERT" -passin env:CSC_KEY_PASSWORD -noout 2>/dev/null; then
            echo "The certificate in CSC_LINK could not be opened. Paste the whole of CSC_LINK.txt again, and check CSC_KEY_PASSWORD." && exit 1
          fi
          # Put the certificate in Codemagic's own keychain. It is unlocked with no timeout and allows
          # codesign without a password prompt, so signing cannot hang waiting for input.
          keychain initialize
          keychain add-certificates --certificate "$CERT" --certificate-password "$CSC_KEY_PASSWORD"
          security find-identity -v -p codesigning
          if [ -n "$APP_STORE_CONNECT_PRIVATE_KEY" ]; then
            mkdir -p ~/private_keys
            echo "$APP_STORE_CONNECT_PRIVATE_KEY" > ~/private_keys/AuthKey.p8
            echo "APPLE_API_KEY=$HOME/private_keys/AuthKey.p8" >> $CM_ENV
            echo "APPLE_API_KEY_ID=$APP_STORE_CONNECT_KEY_IDENTIFIER" >> $CM_ENV
            echo "APPLE_API_ISSUER=$APP_STORE_CONNECT_ISSUER_ID" >> $CM_ENV
          elif [ -z "$APPLE_ID" ]; then
            echo "Add the App Store Connect API key or an Apple ID for notarization." && exit 1
          fi
      - name: Install Apple's Developer ID intermediate certificate
        script: |
          # Without it macOS reports the Developer ID certificate as not trusted (CSSMERR_TP_NOT_TRUSTED)
          # and electron-builder skips signing.
          curl -fsSL -o /tmp/DeveloperIDG2CA.cer https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          curl -fsSL -o /tmp/AppleWWDRCAG3.cer https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          sudo security add-certificates -k /Library/Keychains/System.keychain /tmp/DeveloperIDG2CA.cer /tmp/AppleWWDRCAG3.cer || \
            security add-certificates /tmp/DeveloperIDG2CA.cer /tmp/AppleWWDRCAG3.cer || true
          security find-certificate -c "Developer ID Certification Authority" -a | grep -q labl && echo "Intermediate certificate installed."
      - name: Install packages
        script: npm ci
      - name: Build and sign
        script: |
          set -o pipefail
          # Sign from the keychain set up above, not from a file (that path made codesign wait for input).
          unset CSC_LINK CSC_KEY_PASSWORD
          export CSC_IDENTITY_AUTO_DISCOVERY=true
          export CSC_NAME="Moses Atocon (Y8C463562V)"
          export DEBUG=electron-osx-sign*,electron-builder:mac*
          npm run dist:mac 2>&1 | tee /tmp/build.log
          if grep -q "skipped macOS application code signing" /tmp/build.log; then
            echo "Signing was skipped. See the reason above." && exit 1
          fi
      - name: Notarize with Apple
        script: |
          # Notarize the DMG with Apple's own tool. We wait at most 45 minutes. If Apple is slow,
          # the signed files are still kept and the submission id is printed so it can be finished later.
          DMG=$(ls release/*.dmg | head -1)
          echo "Submitting $DMG"
          xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" --wait --timeout 45m --output-format json | tee /tmp/notary.json || true
          ID=$(python3 -c "import json;print(json.load(open('/tmp/notary.json')).get('id',''))" 2>/dev/null)
          STATUS=$(python3 -c "import json;print(json.load(open('/tmp/notary.json')).get('status',''))" 2>/dev/null)
          echo "Notarization id: $ID  status: $STATUS"
          xcrun notarytool history --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" | head -15 || true
          if [ "$STATUS" = "Accepted" ]; then
            xcrun stapler staple "$DMG" && echo "Notarized and stapled."
          elif [ -n "$ID" ]; then
            xcrun notarytool log "$ID" --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" || true
          fi
      - name: Check the signature
        script: |
          APP=$(ls -d release/mac-universal/*.app | head -1)
          codesign --verify --deep --strict --verbose=2 "$APP"
          spctl --assess --type execute --verbose "$APP" || echo "Gatekeeper check needs the notarization above to be accepted."
          DMG=$(ls release/*.dmg | head -1)
          xcrun stapler validate "$DMG" || echo "The DMG is signed but not stapled yet."
    artifacts:
      - release/*.dmg
      - release/*.zip
